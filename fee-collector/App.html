<script>
const state = {
  data: null,
  selectedGameId: null,
  lastReceipt: null,
  toastTimer: null,
  rosterPreview: null,
  emergencyLineNumbers: new Set(),
};

const els = {};

document.addEventListener('DOMContentLoaded', () => {
  Object.assign(els, {
    gameSelect: document.getElementById('gameSelect'),
    gameMeta: document.getElementById('gameMeta'),
    playerSearch: document.getElementById('playerSearch'),
    playerSearchResults: document.getElementById('playerSearchResults'),
    participantPicker: document.getElementById('participantPicker'),
    participantPickerMessage: document.getElementById('participantPickerMessage'),
    emergencyName: document.getElementById('emergencyName'),
    addEmergencyButton: document.getElementById('addEmergencyButton'),
    rosterText: document.getElementById('rosterText'),
    previewRosterButton: document.getElementById('previewRosterButton'),
    rosterPreview: document.getElementById('rosterPreview'),
    absentSection: document.getElementById('absentSection'),
    absentList: document.getElementById('absentList'),
    summary: document.getElementById('summary'),
    unpaidList: document.getElementById('unpaidList'),
    unpaidCount: document.getElementById('unpaidCount'),
    receivedList: document.getElementById('receivedList'),
    receivedCount: document.getElementById('receivedCount'),
    receivedToggle: document.getElementById('receivedToggle'),
    cancelledList: document.getElementById('cancelledList'),
    cancelledCount: document.getElementById('cancelledCount'),
    cancelledToggle: document.getElementById('cancelledToggle'),
    refreshButton: document.getElementById('refreshButton'),
    ledgerLink: document.getElementById('ledgerLink'),
    completeGameButton: document.getElementById('completeGameButton'),
    toast: document.getElementById('toast'),
    receiptDialog: document.getElementById('receiptDialog'),
    receiptBody: document.getElementById('receiptBody'),
    closeReceiptButton: document.getElementById('closeReceiptButton'),
    completeDialog: document.getElementById('completeDialog'),
    cancelCompleteButton: document.getElementById('cancelCompleteButton'),
    confirmCompleteButton: document.getElementById('confirmCompleteButton'),
  });

  els.gameSelect.addEventListener('change', () => {
    state.rosterPreview = null;
    state.emergencyLineNumbers.clear();
    load(els.gameSelect.value);
  });
  let searchTimer;
  els.playerSearch.addEventListener('input', () => {
    clearTimeout(searchTimer);
    els.playerSearchResults.innerHTML = '';
    const query = els.playerSearch.value.trim();
    if (!query || !state.selectedGameId) {
      els.participantPickerMessage.textContent = '背番号か名前を入力して選手を検索してください。';
      return;
    }
    els.participantPickerMessage.textContent = '検索中…';
    searchTimer = setTimeout(() => searchPlayers(query), 250);
  });
  els.refreshButton.addEventListener('click', () => load(state.selectedGameId));
  els.receivedToggle.addEventListener('click', toggleReceived);
  els.cancelledToggle.addEventListener('click', toggleCancelled);
  els.closeReceiptButton.addEventListener('click', () => els.receiptDialog.close());
  els.completeGameButton.addEventListener('click', () => els.completeDialog.showModal());
  els.cancelCompleteButton.addEventListener('click', () => els.completeDialog.close());
  els.confirmCompleteButton.addEventListener('click', completeSelectedGame);
  els.previewRosterButton.addEventListener('click', requestRosterPreview);
  els.addEmergencyButton.addEventListener('click', addEmergencyParticipant);

  load(null);
});

function load(gameId) {
  setLoading(true);
  google.script.run
    .withSuccessHandler((data) => {
      if (state.selectedGameId && data.selectedGame && state.selectedGameId !== data.selectedGame.id) {
        state.rosterPreview = null;
        state.emergencyLineNumbers.clear();
      }
      state.data = data;
      state.selectedGameId = data.selectedGame ? data.selectedGame.id : null;
      els.ledgerLink.href = data.ledgerUrl;
      els.ledgerLink.hidden = !data.ledgerUrl;
      render();
      setLoading(false);
    })
    .withFailureHandler(handleError)
    .getBootstrap(gameId);
}

function render() {
  renderGames();
  renderSummary();
  renderParticipants();
  renderAbsentParticipants();
  renderRosterPreview();
  renderReceived();
  renderCancelled();
  renderParticipantPicker();
}

function renderParticipantPicker() {
  const game = state.data.selectedGame;
  const canAdd = game && game.status !== '完了' && game.status !== '中止';
  els.playerSearch.disabled = !canAdd;
  els.participantPickerMessage.textContent = canAdd
    ? '背番号か名前を入力して選手を検索してください。'
    : '参加者を追加できる試合が選択されていません。';
  els.playerSearchResults.innerHTML = '';
}

function searchPlayers(query) {
  google.script.run
    .withSuccessHandler((players) => {
      if (query !== els.playerSearch.value.trim()) return;
      if (!players.length) {
        els.playerSearchResults.innerHTML = '';
        els.participantPickerMessage.textContent = '該当する選手がいません。背番号か名前を確認してください。';
        return;
      }
      els.participantPickerMessage.textContent = '該当する選手を選んでください。';
      els.playerSearchResults.innerHTML = players.map((player) =>
        '<button class="search-result" type="button" data-player-id="' + escapeHtml(player.playerId) + '">' +
        escapeHtml((player.jerseyNumber ? '#' + player.jerseyNumber + ' ' : '') + player.name) + '　追加</button>'
      ).join('');
      els.playerSearchResults.querySelectorAll('[data-player-id]').forEach((button) => {
        button.addEventListener('click', () => addParticipant(button.dataset.playerId, button));
      });
    })
    .withFailureHandler(handleError)
    .searchPlayers(query);
}

function addParticipant(playerId, button) {
  button.disabled = true;
  google.script.run
    .withSuccessHandler((data) => {
      state.data = data;
      state.selectedGameId = data.selectedGame ? data.selectedGame.id : null;
      els.playerSearch.value = '';
      render();
      showToast('参加者を追加しました。');
    })
    .withFailureHandler((error) => { button.disabled = false; handleError(error); })
    .addParticipant({ gameId: state.selectedGameId, playerId });
}

function addEmergencyParticipant() {
  const name = els.emergencyName.value.trim();
  if (!name || !state.selectedGameId) return;
  els.addEmergencyButton.disabled = true;
  google.script.run
    .withSuccessHandler((result) => {
      state.data = result.state;
      state.selectedGameId = result.state.selectedGame ? result.state.selectedGame.id : null;
      els.emergencyName.value = '';
      render();
      els.addEmergencyButton.disabled = false;
      showToast('緊急参加者を追加しました。');
    })
    .withFailureHandler((error) => { els.addEmergencyButton.disabled = false; handleError(error); })
    .addEmergencyParticipant({ gameId: state.selectedGameId, name });
}

function requestRosterPreview() {
  const rosterText = els.rosterText.value;
  if (!state.selectedGameId || !rosterText.trim()) {
    showToast('参加者リストを貼り付けてください。');
    return;
  }
  els.previewRosterButton.disabled = true;
  els.rosterPreview.innerHTML = '<p class="picker-message">選手マスターと照合しています…</p>';
  google.script.run
    .withSuccessHandler((preview) => {
      state.rosterPreview = preview;
      els.previewRosterButton.disabled = false;
      renderRosterPreview();
    })
    .withFailureHandler((error) => {
      els.previewRosterButton.disabled = false;
      els.rosterPreview.innerHTML = '';
      handleError(error);
    })
    .previewRosterImport({
      gameId: state.selectedGameId,
      rosterText,
      emergencyLineNumbers: [...state.emergencyLineNumbers],
    });
}

function renderRosterPreview() {
  const preview = state.rosterPreview;
  if (!preview) {
    els.rosterPreview.innerHTML = '';
    return;
  }
  const attendees = preview.attendees || [];
  const attendeeRows = attendees.map((player) =>
    '<li>' + escapeHtml((player.jerseyNumber ? '#' + player.jerseyNumber + ' ' : '') + player.name +
      (player.emergency ? '（緊急参加者）' : '')) + '</li>'
  ).join('');
  const unresolvedRows = (preview.unresolved || []).map((row) => {
    const canSelectEmergency = row.status === 'not_found' && row.name;
    const label = row.lineNumber + '行目: ' + (row.name || row.jerseyNumber || '文字を読み取れません');
    return '<li class="unresolved-roster-row">' +
      '<span>' + escapeHtml(label + ' — ' + rosterStatusLabel(row.status)) + '</span>' +
      (canSelectEmergency
        ? '<label class="emergency-check"><input type="checkbox" data-emergency-line="' + Number(row.lineNumber) + '"' +
          (state.emergencyLineNumbers.has(Number(row.lineNumber)) ? ' checked' : '') +
          '> 緊急参加者として登録</label>'
        : '') + '</li>';
  }).join('');
  const absenceRows = (preview.absences || []).map((player) =>
    '<li>' + escapeHtml(player.name) + (player.blocked ? ' — 受領済みのため欠席にできません' : ' — 欠席予定') + '</li>'
  ).join('');
  const canConfirm = preview.readyToConfirm && ((preview.additions || []).length || (preview.absences || []).length);
  els.rosterPreview.innerHTML =
    '<div class="roster-preview-card">' +
      '<h3>' + escapeHtml(preview.game ? preview.game.date + ' ' + preview.game.opponent : '対象試合') + ' の確認内容</h3>' +
      '<p>参加者候補 ' + attendees.length + '人 ・ 追加 ' + (preview.additions || []).length + '人 ・ 欠席 ' + (preview.absences || []).length + '人</p>' +
      (attendeeRows ? '<strong>照合できた参加者</strong><ul>' + attendeeRows + '</ul>' : '') +
      (absenceRows ? '<strong>現在の参加者との差</strong><ul>' + absenceRows + '</ul>' : '') +
      (unresolvedRows ? '<strong>確認が必要な行</strong><ul>' + unresolvedRows + '</ul>' : '') +
      (preview.readyToConfirm
        ? '<p class="roster-ready">この内容を確認して反映できます。</p>'
        : '<p class="roster-warning">確認が必要な行、または受領済みの欠席があります。修正して再確認してください。</p>') +
      '<button id="confirmRosterButton" class="primary-button roster-control" type="button"' +
        (canConfirm ? '' : ' disabled') + '>この内容で参加者を反映</button>' +
    '</div>';
  els.rosterPreview.querySelectorAll('[data-emergency-line]').forEach((checkbox) => {
    checkbox.addEventListener('change', () => {
      const lineNumber = Number(checkbox.dataset.emergencyLine);
      if (checkbox.checked) state.emergencyLineNumbers.add(lineNumber);
      else state.emergencyLineNumbers.delete(lineNumber);
      requestRosterPreview();
    });
  });
  const confirmButton = document.getElementById('confirmRosterButton');
  confirmButton.addEventListener('click', () => confirmRosterImport(confirmButton));
}

function rosterStatusLabel(status) {
  return ({
    not_found: '選手マスターに一致しません',
    ambiguous: '複数の選手に一致します',
    conflict: '背番号と名前が一致しません',
    uncertain: '画像の読み取りが不確かです',
    duplicate: '同じ選手が重複しています',
  })[status] || '確認してください';
}

function confirmRosterImport(button) {
  const preview = state.rosterPreview;
  if (!preview || !preview.readyToConfirm || !state.selectedGameId) return;
  button.disabled = true;
  google.script.run
    .withSuccessHandler((result) => {
      state.data = result.state;
      state.selectedGameId = result.state.selectedGame ? result.state.selectedGame.id : null;
      state.rosterPreview = null;
      state.emergencyLineNumbers.clear();
      els.rosterText.value = '';
      render();
      showToast(result.alreadyApplied ? 'この参加者リストは反映済みです。' : '参加者と会計を更新しました。');
    })
    .withFailureHandler((error) => { button.disabled = false; handleError(error); })
    .applyConfirmedRoster({
      gameId: state.selectedGameId,
      rosterText: els.rosterText.value,
      emergencyLineNumbers: [...state.emergencyLineNumbers],
      previewFingerprint: preview.previewFingerprint,
    });
}

function setParticipantAttendance(playerId, attending, button) {
  button.disabled = true;
  const update = google.script.run
    .withSuccessHandler((data) => {
      state.data = data;
      state.selectedGameId = data.selectedGame ? data.selectedGame.id : null;
      state.rosterPreview = null;
      render();
      showToast(attending ? '参加に戻しました。' : '欠席にしました。');
    })
    .withFailureHandler((error) => { button.disabled = false; handleError(error); });
  if (attending) update.restoreParticipantAttendance({ gameId: state.selectedGameId, playerId });
  else update.markParticipantAbsent({ gameId: state.selectedGameId, playerId });
}

function renderGames() {
  const { games, selectedGame } = state.data;
  els.gameSelect.innerHTML = games
    .map((game) => {
      const selected = selectedGame && game.id === selectedGame.id ? ' selected' : '';
      return '<option value="' + escapeHtml(game.id) + '"' + selected + '>' +
        escapeHtml(game.date + ' ' + (game.opponent || '対戦相手未設定') + ' [' + game.status + ']') +
        '</option>';
    })
    .join('');

  if (!selectedGame) {
    els.gameMeta.textContent = '試合が登録されていません。';
    els.completeGameButton.disabled = true;
    return;
  }

  els.completeGameButton.disabled = selectedGame.status === '完了' || selectedGame.status === '中止';
  els.gameMeta.innerHTML = [
    '<strong>' + escapeHtml(selectedGame.date) + '</strong>',
    escapeHtml(selectedGame.opponent || '対戦相手未設定'),
    escapeHtml(selectedGame.location || '場所未設定'),
  ].join(' ・ ');
}

function renderSummary() {
  const s = state.data.summary;
  els.summary.innerHTML = [
    summaryCard('参加', s.participants + '人'),
    summaryCard('請求予定', yen(s.expected)),
    summaryCard('受領済', yen(s.received)),
    summaryCard('未収', yen(s.outstanding), 'outstanding'),
  ].join('');
}

function summaryCard(label, value, className = '') {
  return '<div class="summary-card ' + className + '">' +
    '<div class="summary-label">' + escapeHtml(label) + '</div>' +
    '<div class="summary-value">' + escapeHtml(value) + '</div>' +
    '</div>';
}

function renderParticipants() {
  const unpaid = state.data.participants.filter((player) => !player.paid);
  const canEditAttendance = state.data.selectedGame && !['完了', '中止'].includes(state.data.selectedGame.status);
  els.unpaidCount.textContent = unpaid.length;

  if (!unpaid.length) {
    els.unpaidList.innerHTML = '<div class="empty-state">全員受領済みです。</div>';
    return;
  }

  els.unpaidList.innerHTML = unpaid
    .map((player) => {
      return '<article class="player-card" data-player-id="' + escapeHtml(player.playerId) + '">' +
        '<div class="player-top">' +
          '<div class="player-name">' + escapeHtml((player.jerseyNumber ? '#' + player.jerseyNumber + ' ' : '') + player.name) + '</div>' +
          '<div class="player-due">' + yen(player.outstanding) + '</div>' +
        '</div>' +
        (!player.chargeConfigured
          ? '<div class="empty-state">請求額未設定</div>'
          : '<div class="payment-actions">' +
          '<button class="cash-button" data-action="pay" data-method="現金" data-player="' + escapeHtml(player.playerId) + '">現金' + escapeHtml(String(player.outstanding)) + '円</button>' +
          '<button class="paypay-button" data-action="pay" data-method="PayPay" data-player="' + escapeHtml(player.playerId) + '">PayPay確認</button>' +
          '<button class="bank-button" data-action="pay" data-method="銀行振込" data-player="' + escapeHtml(player.playerId) + '">銀行振込確認</button>' +
        '</div>') +
        (canEditAttendance
          ? '<button class="attendance-action" data-action="absent" data-player="' + escapeHtml(player.playerId) + '">欠席にする</button>'
          : '') +
      '</article>';
    })
    .join('');

  els.unpaidList.querySelectorAll('[data-action="pay"]').forEach((button) => {
    button.addEventListener('click', () => {
      recordPayment(button.dataset.player, button.dataset.method, button);
    });
  });
  els.unpaidList.querySelectorAll('[data-action="absent"]').forEach((button) => {
    button.addEventListener('click', () => setParticipantAttendance(button.dataset.player, false, button));
  });
}

function renderAbsentParticipants() {
  const absent = state.data.absentParticipants || [];
  const canRestore = state.data.selectedGame && !['完了', '中止'].includes(state.data.selectedGame.status);
  els.absentSection.hidden = !absent.length;
  els.absentList.innerHTML = absent.map((player) =>
    '<article class="player-card"><div class="player-top"><div class="player-name">' +
      escapeHtml((player.jerseyNumber ? '#' + player.jerseyNumber + ' ' : '') + player.name) +
      '</div>' + (canRestore
        ? '<button class="attendance-action" data-action="restore" data-player="' + escapeHtml(player.playerId) + '">参加に戻す</button>'
        : '') + '</div></article>'
  ).join('');
  els.absentList.querySelectorAll('[data-action="restore"]').forEach((button) => {
    button.addEventListener('click', () => setParticipantAttendance(button.dataset.player, true, button));
  });
}

function renderReceived() {
  const receivedPlayers = state.data.participants.filter((player) => player.paid);
  els.receivedCount.textContent = receivedPlayers.length;

  if (!receivedPlayers.length) {
    els.receivedList.innerHTML = '<div class="empty-state">まだ受領記録はありません。</div>';
    return;
  }

  els.receivedList.innerHTML = receivedPlayers
    .map((player) => {
      const receipt = player.receipts[player.receipts.length - 1];
      if (!receipt) return '';
      return '<div class="received-row">' +
        '<div>' +
          '<div class="received-name">' + escapeHtml(player.name) + '</div>' +
          '<div class="received-meta">' + escapeHtml(receipt.method + ' ・ ' + receipt.receivedAt) + '</div>' +
        '</div>' +
        '<div class="received-amount">✓ ' + yen(receipt.amount) + '</div>' +
        '<button class="receipt-link" data-receipt="' + escapeHtml(receipt.id) + '">受領票を表示</button>' +
      '</div>';
    })
    .join('');

  els.receivedList.querySelectorAll('[data-receipt]').forEach((button) => {
    button.addEventListener('click', () => {
      const receipt = findReceipt(button.dataset.receipt);
      if (receipt) showReceipt(receipt);
    });
  });
}

function renderCancelled() {
  const cancelled = state.data.cancelled || [];
  els.cancelledCount.textContent = cancelled.length;

  if (!cancelled.length) {
    els.cancelledList.innerHTML = '<div class="empty-state">取消履歴はありません。</div>';
    return;
  }

  els.cancelledList.innerHTML = cancelled
    .map((receipt) => {
      return '<div class="cancelled-row">' +
        '<div>' +
          '<div class="received-name">' + escapeHtml(receipt.name) + '</div>' +
          '<div class="received-meta">' + escapeHtml(receipt.method + ' ・ ' + receipt.receivedAt) + '</div>' +
          '<div class="cancelled-meta">ID: ' + escapeHtml(receipt.id) + '</div>' +
        '</div>' +
        '<div class="cancelled-status">取消<br>' + yen(receipt.amount) + '</div>' +
      '</div>';
    })
    .join('');
}

function recordPayment(playerId, method, button) {
  if (!state.selectedGameId) return;

  const card = button.closest('.player-card');
  card.classList.add('loading');
  card.querySelectorAll('button').forEach((btn) => (btn.disabled = true));

  google.script.run
    .withSuccessHandler((result) => {
      if (!result.ok && result.code === 'ALREADY_PAID') {
        state.data = result.state;
        render();
        showToast(result.message);
        return;
      }

      state.lastReceipt = result.receipt;
      state.data = result.state;
      render();
      showPaymentToast(result.receipt);
    })
    .withFailureHandler(handleError)
    .recordPayment({
      gameId: state.selectedGameId,
      playerId,
      method,
    });
}

function showPaymentToast(receipt) {
  clearTimeout(state.toastTimer);
  els.toast.innerHTML =
    '<span class="toast-message">' +
      escapeHtml(receipt.name + ' ' + receipt.method + ' ' + yen(receipt.amount) + ' を受領') +
    '</span>' +
    '<button id="showReceiptToastButton" type="button">受領票</button>' +
    '<button id="undoToastButton" type="button">取り消す</button>';
  els.toast.classList.add('is-visible');

  document.getElementById('showReceiptToastButton').addEventListener('click', () => {
    showReceipt(receipt);
  });
  document.getElementById('undoToastButton').addEventListener('click', () => {
    undoReceipt(receipt.id);
  });

  state.toastTimer = setTimeout(hideToast, 9000);
}

function showToast(message) {
  clearTimeout(state.toastTimer);
  els.toast.innerHTML = '<span class="toast-message">' + escapeHtml(message) + '</span>';
  els.toast.classList.add('is-visible');
  state.toastTimer = setTimeout(hideToast, 5000);
}

function hideToast() {
  els.toast.classList.remove('is-visible');
}

function undoReceipt(receiptId) {
  setLoading(true);
  google.script.run
    .withSuccessHandler((result) => {
      if (result.state) {
        state.data = result.state;
        state.selectedGameId = result.state.selectedGame ? result.state.selectedGame.id : state.selectedGameId;
      }
      render();
      hideToast();
      showToast('受領記録を取り消しました。履歴は削除せず「取消」として残ります。');
      setLoading(false);
    })
    .withFailureHandler(handleError)
    .cancelReceipt(receiptId);
}

function showReceipt(receipt) {
  const game = state.data.games.find((item) => item.id === receipt.gameId) || state.data.selectedGame;
  els.receiptBody.innerHTML =
    '<dl class="receipt-grid">' +
      receiptLine('試合', game ? game.date + ' ' + game.opponent : receipt.gameId) +
      receiptLine('選手', receipt.name) +
      receiptLine('金額', yen(receipt.amount)) +
      receiptLine('方法', receipt.method) +
      receiptLine('受領日時', receipt.receivedAt) +
      receiptLine('受領ID', receipt.id) +
    '</dl>';
  els.receiptDialog.showModal();
}

function receiptLine(label, value) {
  return '<dt>' + escapeHtml(label) + '</dt><dd>' + escapeHtml(value || '') + '</dd>';
}

function completeSelectedGame() {
  if (!state.selectedGameId) return;
  els.completeDialog.close();
  setLoading(true);

  google.script.run
    .withSuccessHandler((data) => {
      state.data = data;
      state.selectedGameId = data.selectedGame ? data.selectedGame.id : null;
      render();
      showToast('試合を完了しました。次の未完了試合に切り替えました。');
      setLoading(false);
    })
    .withFailureHandler(handleError)
    .completeGame(state.selectedGameId);
}

function toggleReceived() {
  const collapsed = els.receivedList.classList.toggle('is-collapsed');
  els.receivedToggle.setAttribute('aria-expanded', String(!collapsed));
}

function toggleCancelled() {
  const collapsed = els.cancelledList.classList.toggle('is-collapsed');
  els.cancelledToggle.setAttribute('aria-expanded', String(!collapsed));
}

function findReceipt(receiptId) {
  for (const player of state.data.participants) {
    const receipt = (player.receipts || []).find((item) => item.id === receiptId);
    if (receipt) return receipt;
  }
  return null;
}

function setLoading(isLoading) {
  document.body.classList.toggle('loading', isLoading);
}

function handleError(error) {
  setLoading(false);
  const message = error && error.message ? error.message : String(error || 'エラーが発生しました。');
  showToast(message);
}

function yen(value) {
  return '¥' + Number(value || 0).toLocaleString('ja-JP');
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
</script>
