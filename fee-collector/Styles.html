<style>
:root {
  --purple: #4b2e83;
  --purple-2: #6b46a8;
  --yellow: #f5c842;
  --bg: #f6f5f8;
  --card: #ffffff;
  --text: #211a2b;
  --muted: #756e80;
  --line: #e5e1e9;
  --danger: #a63d33;
  --success: #24704a;
  --shadow: 0 8px 24px rgba(40, 25, 60, 0.08);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
}
button, select { font: inherit; }
button { touch-action: manipulation; }
.shell {
  width: min(100%, 640px);
  margin: 0 auto;
  padding: 18px 16px calc(40px + env(safe-area-inset-bottom));
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.header-actions { display: flex; align-items: center; gap: 10px; }
.ledger-link {
  color: var(--purple);
  font-size: 13px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}
.ledger-link[hidden] { display: none; }
h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: 28px; line-height: 1.1; }
h2 { margin-bottom: 0; font-size: 20px; }
.eyebrow {
  margin-bottom: 4px;
  color: var(--purple);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
}
.icon-button {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: var(--purple);
  font-size: 24px;
}
.game-panel, .section-block {
  margin-bottom: 16px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
}

.participant-picker label { display:block; margin: 0 0 8px; color:var(--muted); font-weight:700; }
.participant-picker input { width:100%; min-height:52px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font:inherit; }
.picker-message { color:var(--muted); margin-top:10px; }
.emergency-entry { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.emergency-entry-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.emergency-entry-row input { min-width: 0; }
.roster-import-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.roster-import-panel label { display: block; margin: 12px 0 7px; color: var(--muted); font-weight: 700; }
.roster-import-panel textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; resize: vertical; }
.roster-control { width: 100%; min-height: 52px; margin-top: 10px; }
.roster-preview-card { padding: 12px 0; border-top: 1px solid var(--line); }
.roster-preview-card:first-child { border-top: 0; }
.roster-summary { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 12px 0; color: var(--muted); }
.roster-summary strong { color: var(--text); }
.unresolved-roster-row { margin-top: 10px; padding: 12px; border: 1px solid #ead590; border-radius: 12px; background: #fffaf0; }
.emergency-check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.emergency-check input { width: 20px; height: 20px; }
.roster-warning { color: var(--danger); font-weight: 700; }
.roster-ready { color: var(--success); font-weight: 700; }
.absent-section { margin-top: 12px; }
.attendance-action { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: white; color: var(--danger); font-weight: 700; }
.search-results { display:grid; gap:8px; margin-top:10px; }
.search-result { min-height:50px; text-align:left; border:1px solid var(--line); border-radius:12px; background:#fff; padding:10px 14px; font:inherit; font-weight:700; color:var(--text); }
.search-result:disabled { opacity:.55; }
.game-panel label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.game-panel select {
  width: 100%;
  min-height: 46px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  color: var(--text);
  font-weight: 700;
}
.game-meta {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}
.text-button {
  margin-top: 10px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--purple);
  font-weight: 700;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.summary-card {
  min-height: 94px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
}
.summary-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.summary-value {
  margin-top: 8px;
  font-size: 25px;
  font-weight: 850;
}
.summary-card.outstanding { border-color: #ead590; background: #fffaf0; }
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 14px;
}
.toggle-heading {
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  color: inherit;
}
.count-badge {
  min-width: 32px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #eee9f5;
  color: var(--purple);
  text-align: center;
  font-size: 13px;
  font-weight: 800;
}
.player-list { display: grid; gap: 12px; }
.player-card {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
}
.player-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.player-name { font-size: 18px; font-weight: 800; }
.player-due { color: var(--purple); font-size: 18px; font-weight: 850; }
.payment-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.primary-button, .cash-button, .paypay-button, .secondary-button {
  min-height: 46px;
  border-radius: 12px;
  font-weight: 800;
}
.cash-button, .primary-button {
  border: 0;
  background: var(--purple);
  color: white;
}
.bank-button {
  grid-column: 1 / -1;
  border: 1px solid var(--purple-2);
  background: #f4f0fb;
  color: var(--purple);
}
.paypay-button {
  border: 2px solid var(--yellow);
  background: #fff9df;
  color: #574400;
}
.secondary-button {
  border: 1px solid var(--line);
  background: white;
  color: var(--text);
}
button:disabled { opacity: .45; }
.full-width { width: 100%; }
.empty-state {
  padding: 24px 10px;
  color: var(--muted);
  text-align: center;
}
.received-list { display: grid; gap: 8px; }
.received-list.is-collapsed { display: none; }
.cancelled-list { display: grid; gap: 8px; }
.cancelled-list.is-collapsed { display: none; }
.received-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.received-row:first-child { border-top: 0; }
.received-name { font-weight: 800; }
.received-meta { color: var(--muted); font-size: 12px; }
.received-amount { color: var(--success); font-weight: 850; }
.cancelled-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.cancelled-row:first-child { border-top: 0; }
.cancelled-status { color: var(--danger); font-weight: 850; text-align: right; }
.cancelled-meta { color: var(--danger); font-size: 12px; }
.receipt-link {
  grid-column: 1 / -1;
  width: fit-content;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--purple);
  font-size: 12px;
  font-weight: 700;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  z-index: 20;
  display: none;
  width: min(calc(100% - 28px), 600px);
  padding: 14px;
  transform: translateX(-50%);
  border-radius: 14px;
  background: #241b2f;
  color: white;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}
.toast.is-visible { display: flex; align-items: center; gap: 8px; }
.toast-message { flex: 1; font-size: 14px; }
.toast button {
  border: 0;
  background: transparent;
  color: var(--yellow);
  font-weight: 800;
}
dialog {
  width: min(calc(100% - 28px), 520px);
  padding: 0;
  border: 0;
  border-radius: 20px;
  box-shadow: 0 18px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(24, 16, 32, .55); }
.receipt-card, .confirm-card { padding: 22px; background: white; }
.receipt-grid {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 10px;
  margin: 20px 0;
  padding: 16px 0;
  border-top: 1px dashed var(--line);
  border-bottom: 1px dashed var(--line);
}
.receipt-grid dt { color: var(--muted); }
.receipt-grid dd { margin: 0; font-weight: 750; overflow-wrap: anywhere; }
.dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.loading { opacity: .55; pointer-events: none; }
@media (max-width: 559px) {

    width: 100%;
    padding: 16px 12px calc(32px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 32px; }
  h2 { font-size: 23px; }
  .eyebrow { font-size: 12px; }
  .game-panel, .section-block { padding: 18px; }
  .game-panel label, .summary-label { font-size: 14px; }
  .game-panel select { min-height: 54px; font-size: 17px; }
  .game-meta { font-size: 16px; }
  .roster-control { min-height: 56px; font-size: 16px; }
  .emergency-entry-row { grid-template-columns: 1fr; }
  .emergency-entry-row .secondary-button { min-height: 52px; }
  .attendance-action { min-height: 48px; }
  .summary-card { min-height: 100px; padding: 16px; }
  .summary-value { font-size: 26px; }
  .player-card { padding: 16px; }
  .player-name, .player-due { font-size: 21px; }
  .primary-button, .cash-button, .paypay-button, .secondary-button {
    min-height: 56px;
    font-size: 17px;
  }
  .bank-button { min-height: 52px; font-size: 16px; }
  .count-badge { min-width: 36px; font-size: 14px; }
}
@media (min-width: 560px) {
  .summary-grid { grid-template-columns: repeat(4, 1fr); }
  .summary-value { font-size: 22px; }
}
@media (max-width: 1024px) and (pointer: coarse) {
  body { font-size: 4.5vw; }
  .shell {
    width: 100vw;
    max-width: none;
    padding: 3vw 3vw calc(8vw + env(safe-area-inset-bottom));
  }
  h1 { font-size: 8vw; }
  h2 { font-size: 6vw; }
  .eyebrow { font-size: 3.5vw; }
  .game-panel, .section-block { padding: 4vw; }
  .game-panel label, .summary-label { font-size: 4vw; }
  .game-panel select { min-height: 14vw; font-size: 4.5vw; }
  .game-meta { font-size: 4.2vw; }
  .summary-card { min-height: 24vw; padding: 4vw; }
  .summary-value { font-size: 6.5vw; }
  .player-card { padding: 4vw; }
  .player-name, .player-due { font-size: 5.5vw; }
  .primary-button, .cash-button, .paypay-button, .secondary-button {
    min-height: 14vw;
    font-size: 4.5vw;
  }
  .bank-button { min-height: 12vw; font-size: 4.2vw; }
  .count-badge { min-width: 9vw; font-size: 4vw; }
}
</style>
